# Build and publish a custom image for this fork:
#   ghcr.io/<owner>/nginx-ui:latest
#
# Uses the same layout as e2e/acme/scripts/build-image.sh:
# frontend → linux/amd64 binary → official Dockerfile → GHCR.
name: Docker GHCR

on:
  push:
    branches:
      - dev
      - main
      - master
    paths:
      - "app/**"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "resources/docker/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: nginx-ui
  GO_VERSION: "^1.27.1"
  BUN_VERSION: "1.4.2"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install frontend dependencies
        run: bun ci

      - name: Build frontend
        run: |
          bunx update-browserslist-db@latest
          bun run build

      - name: Install CGO toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev

      - name: Generate version files
        run: go generate cmd/version/generate.go

      - name: Build linux/amd64 binary
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
          GOWORK: "off"
        run: |
          mkdir -p nginx-ui-linux-amd64
          go build -trimpath -tags=jsoniter \
            -ldflags "-s -w -X 'github.com/0xJacky/Nginx-UI/settings.buildTime=$(date +%s)'" \
            -o nginx-ui-linux-amd64/nginx-ui \
            main.go
          chmod +x nginx-ui-linux-amd64/nginx-ui

      - name: Set image name
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TARGETOS=linux
            TARGETARCH=amd64
